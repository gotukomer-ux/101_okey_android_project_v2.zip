name: 101 Okey Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project archive
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract Flutter project
        run: unzip -q 101_okey_android_project_v2.zip

      - name: Apply verified CI compile fixes
        run: python3 ci_patch.py

      - name: Generate Android platform files
        working-directory: 101_okey
        run: bash scripts/bootstrap_android.sh

      - name: Install Flutter packages
        working-directory: 101_okey
        run: flutter pub get

      - name: Analyze source
        working-directory: 101_okey
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        working-directory: 101_okey
        run: flutter test --reporter expanded

      - name: Build release APK
        working-directory: 101_okey
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 101-okey-release-apk
          path: 101_okey/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
