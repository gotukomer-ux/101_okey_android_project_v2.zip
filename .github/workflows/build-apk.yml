name: 101 Okey Android APK (Android 16-17)

on:
  workflow_dispatch:
  push:
    paths:
      - '101_okey_mavi_arayuz_yeni.zip'
      - '.github/workflows/build-apk.yml'
      - 'ci_fix_android16_17.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract uploaded blue UI Flutter project
        run: unzip -q 101_okey_mavi_arayuz_yeni.zip

      - name: Fix Dart LAN stream types and Android 16-17 configuration
        run: python3 ci_fix_android16_17.py

      - name: Save corrected source ZIP to repository
        shell: bash
        run: |
          zip -qr -X /tmp/101_okey_mavi_arayuz_yeni_fixed.zip 101_okey
          if ! cmp -s /tmp/101_okey_mavi_arayuz_yeni_fixed.zip 101_okey_mavi_arayuz_yeni.zip; then
            cp /tmp/101_okey_mavi_arayuz_yeni_fixed.zip 101_okey_mavi_arayuz_yeni.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add 101_okey_mavi_arayuz_yeni.zip
            git commit -m "Fix 101 Okey source for Android 16 and 17"
            git push
          else
            echo "The source ZIP already contains the compatibility fixes."
          fi

      - name: Install Android 17 SDK (API 37)
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          if [[ ! -x "$SDKMANAGER" ]]; then
            echo "Android sdkmanager was not found under $SDK_ROOT." >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          yes | "$SDKMANAGER" --install "platforms;android-37" "build-tools;37.0.0"

      - name: Verify source structure
        working-directory: 101_okey
        run: python3 scripts/static_check.py

      - name: Generate Android platform project (API 37)
        working-directory: 101_okey
        run: bash scripts/bootstrap_android.sh

      - name: Verify Android SDK targets
        working-directory: 101_okey
        run: |
          grep -Eq 'compileSdk = 37|compileSdkVersion 37' android/app/build.gradle.kts android/app/build.gradle
          grep -Eq 'targetSdk = 37|targetSdkVersion 37' android/app/build.gradle.kts android/app/build.gradle

      - name: Resolve packages
        working-directory: 101_okey
        run: flutter pub get

      - name: Static analysis
        working-directory: 101_okey
        run: flutter analyze

      - name: Automated tests
        working-directory: 101_okey
        run: flutter test --reporter expanded

      - name: Build release APK
        working-directory: 101_okey
        run: flutter build apk --release

      - name: Verify APK output
        run: test -s 101_okey/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: classic-101-okey-android-16-17-release-apk
          path: 101_okey/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
