name: 101 Okey Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '101_okey_modern_ui_source_wifi_bots.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract Wi-Fi and bot-enabled Flutter project
        run: unzip -q 101_okey_modern_ui_source_wifi_bots.zip

      - name: Verify project files
        working-directory: 101_okey
        run: test -s pubspec.yaml && test -s lib/main.dart

      - name: Generate Android platform project
        working-directory: 101_okey
        run: bash scripts/bootstrap_android.sh

      - name: Resolve packages
        working-directory: 101_okey
        run: flutter pub get

      - name: Static analysis
        working-directory: 101_okey
        run: flutter analyze

      - name: Automated tests
        working-directory: 101_okey
        run: flutter test --reporter expanded

      - name: Build release APK
        working-directory: 101_okey
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: classic-101-okey-wifi-bots-release-apk
          path: 101_okey/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
